name: Deploy to Cloudflare (Production)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-prod:
    name: Deploy to Cloudflare Production Environment
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15

    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix frontend --legacy-peer-deps
          npm ci --prefix backend --legacy-peer-deps

      - name: Build Frontend (OpenNext / Vinext)
        run: npm run build:vinext || npm run cloudflare:build
        working-directory: frontend

      - name: Deploy Frontend to Cloudflare (Production Environment)
        run: npx wrangler deploy --env prod
        working-directory: frontend

      - name: Apply Backend D1 Schema (Production)
        run: npm --prefix backend run db:push -- --remote
        env:
          D1_ENV: prod
          D1_DATABASE_NAME: consulting-db

      - name: Deploy Backend Worker to Cloudflare (Production Environment)
        run: npx wrangler deploy --env prod
        working-directory: backend
