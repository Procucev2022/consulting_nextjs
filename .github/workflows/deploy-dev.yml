name: Deploy to Cloudflare (Development)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  deploy-dev:
    name: Deploy to Cloudflare Development Environment
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix frontend --legacy-peer-deps
          npm ci --prefix backend --legacy-peer-deps

      - name: Verify Development D1 Account & Database
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured or empty in the dev environment. Add CLOUDFLARE_API_TOKEN to GitHub repository/environment secrets."
            exit 1
          fi
          npx wrangler d1 list --json > "$RUNNER_TEMP/d1-dev-databases.json"
          node -e "
            const fs = require('fs');
            const dbs = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const found = dbs.find(d => d.name === 'consulting_dev' || d.uuid === 'cd822525-56bf-4c48-ac0a-666bea7dd631');
            if (!found) {
              console.error('::error::Configured development D1 database (consulting_dev / cd822525-56bf-4c48-ac0a-666bea7dd631) was not found in the authenticated Cloudflare account.');
              process.exit(1);
            }
            console.log('Verified development D1 database: ' + found.name + ' (' + found.uuid + ')');
          " "$RUNNER_TEMP/d1-dev-databases.json"

      - name: Build Frontend (OpenNext / Vinext)
        run: npm run cloudflare:build
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: "https://consulting-nextjs-backend-dev.anshul-goel.workers.dev"
          BACKEND_INTERNAL_URL: "https://consulting-nextjs-backend-dev.anshul-goel.workers.dev"

      - name: Apply Backend D1 Schema (Development)
        run: npm --prefix backend run db:push -- --remote
        env:
          D1_ENV: dev
          D1_DATABASE_NAME: consulting_dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Backend Worker to Cloudflare (Dev Environment)
        run: npx wrangler deploy --env dev
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Frontend to Cloudflare (Dev Environment)
        run: npx wrangler deploy --env dev
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
