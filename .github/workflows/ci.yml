name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["**"]

concurrency:
  group: pr-qc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CI: "true"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  backend-gate:
    name: Backend Tests, Migrations & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix backend --legacy-peer-deps

      - name: Build Backend
        run: npm run build --prefix backend

      - name: Run Backend Unit Tests & 90% Coverage Gate
        run: npm run test:ci --prefix backend

      - name: TypeScript Typecheck
        run: npm run typecheck --prefix backend

      - name: ESLint Static Analysis
        run: npm run lint --prefix backend

      - name: Synchronize Isolated Local D1 Schema
        run: npm run db:push --prefix backend

      - name: Upload Backend Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage/**
            backend/test-results.json
          if-no-files-found: warn

  frontend-gate:
    name: Frontend Build, Lint, Typecheck & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix frontend --legacy-peer-deps

      - name: Next.js Production Build
        run: npm run build --prefix frontend

      - name: Run Frontend Unit Tests & 90% Coverage Gate
        run: npm run test:ci --prefix frontend

      - name: TypeScript Typecheck
        run: npm run typecheck --prefix frontend

      - name: ESLint Static Analysis
        run: npm run lint --prefix frontend

      - name: Enforce Frontend Performance Budgets
        run: npm run check:budget --prefix frontend

      - name: Upload Frontend Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/**
            frontend/test-results.json
          if-no-files-found: warn

  quality-summary:
    name: Master Quality & PR Summary
    needs: [backend-gate, frontend-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download Backend Coverage
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend
        continue-on-error: true

      - name: Download Frontend Coverage
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend
        continue-on-error: true

      - name: Post PR Summary Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          BACKEND_GATE_RESULT: ${{ needs.backend-gate.result }}
          FRONTEND_GATE_RESULT: ${{ needs.frontend-gate.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            let summaryMarkdown = '';
            try {
              const summaryScript = path.resolve('scripts/generate-ci-summary.js');
              summaryMarkdown = execSync(`node ${summaryScript}`, { encoding: 'utf8' });
            } catch (err) {
              core.error(`Unable to generate the detailed quality summary: ${err.message}`);
              throw err;
            }
            try {
              await core.summary.addRaw(summaryMarkdown).write();
            } catch (summaryErr) {
              console.warn('Unable to write to step summary:', summaryErr);
            }

            const botCommentIdentifier = '<!-- procucev-ci-summary-comment -->';
            const body = `${botCommentIdentifier}\n${summaryMarkdown}`;

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });

              const existingComment = comments.find((c) => c.body && c.body.includes(botCommentIdentifier));
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body,
                });
              }
            } catch (commentErr) {
              core.error(`Unable to post/update the required PR summary: ${commentErr.message}. Ensure GitHub Actions has Read and write permissions in Repository Settings > Actions > General.`);
              throw commentErr;
            }

      - name: Require All Quality Gates To Pass
        if: always() && (needs.backend-gate.result != 'success' || needs.frontend-gate.result != 'success')
        run: exit 1
  deploy-config-check:
    name: Validate Cloudflare Deployment Configuration
    needs: [backend-gate, frontend-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix frontend --legacy-peer-deps
          npm ci --prefix backend --legacy-peer-deps

      - name: Build Frontend (OpenNext / Vinext)
        run: npm run cloudflare:build
        working-directory: frontend

      - name: Validate Production Frontend Worker Bundle
        run: npx wrangler deploy --dry-run --env prod
        working-directory: frontend

      - name: Validate Production Backend Worker Bundle
        run: npx wrangler deploy --dry-run --env prod
        working-directory: backend
