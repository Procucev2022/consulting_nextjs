<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>aiCEV – Internal Assessment</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
    }
    .container {
      text-align: center;
      max-width: 520px;
      padding: 40px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      color: #ef4444;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #f87171;
    }
    .message {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #38bdf8;
      color: #0f172a;
    }
    .btn-primary:hover {
      background: #7dd3fc;
    }
    .btn-secondary {
      background: rgba(148, 163, 184, 0.15);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
    .btn-secondary:hover {
      background: rgba(148, 163, 184, 0.25);
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
    </svg>
    <div class="title">aiCEV could not start its internal services.</div>
    <div class="message">
      A required internal service did not initialize. Please verify system resources or try restarting the application.
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="retry()">Retry</button>
      <button class="btn btn-secondary" onclick="closeApp()">Close</button>
    </div>
  </div>
  <script>
    function retry() {
      if (window.aicevDesktop && window.aicevDesktop.retryStartup) {
        window.aicevDesktop.retryStartup();
      } else {
        location.reload();
      }
    }
    function closeApp() {
      if (window.aicevDesktop && window.aicevDesktop.closeApp) {
        window.aicevDesktop.closeApp();
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>
