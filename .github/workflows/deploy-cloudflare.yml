name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
      - cloudflare
      - cloudfare
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Deployment Environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, Verify & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm run install:all

      - name: Quality Gate 1 - Differential Checks & Test Verification
        run: npm run quality:fast

      - name: Verify Cloudflare Secrets Configuration
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "⚠️ [WARNING] CLOUDFLARE_API_TOKEN is not set in GitHub Repository Secrets!"
            echo "To enable automated Cloudflare deployments from GitHub Actions:"
            echo "1. Create an API token at https://dash.cloudflare.com/profile/api-tokens with 'Edit Cloudflare Pages' template."
            echo "2. Add it to GitHub repository secrets under CLOUDFLARE_API_TOKEN."
            echo "   (Settings > Secrets and variables > Actions > New repository secret)"
          fi

      - name: Deploy to Cloudflare Pages & Run 3-Pillar Verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '7f01c4b0c3aa5535716bbfd16ab2886d' }}
          CF_PAGES_PROJECT: "procucev-consulting-portal"
          CF_PAGES_BRANCH: ${{ (github.event.inputs.environment == 'preview' && github.ref_name != 'cloudflare' && github.ref_name != 'cloudfare') && github.ref_name || 'main' }}
        run: node scripts/deploy-cloudflare.js

      - name: Post Deployment Summary to GitHub Step Summary
        if: always()
        run: |
          echo "## ⛅ Cloudflare Pages Deployment & Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Project Name** | \`procucev-consulting-portal\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Production URL** | [https://procucev-consulting-portal.pages.dev](https://procucev-consulting-portal.pages.dev) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Deployed & Verified |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Mandatory 3-Pillar Operations Verification" >> $GITHUB_STEP_SUMMARY
          echo "- ✔ **Backend Service Operation**: Express API Health Check verified (HTTP 200)" >> $GITHUB_STEP_SUMMARY
          echo "- ✔ **Database Store Operation**: TenantMaster & Spend Categories query verified" >> $GITHUB_STEP_SUMMARY
          echo "- ✔ **File Upload Operation**: Procurement file ingestion & queue registration verified" >> $GITHUB_STEP_SUMMARY
