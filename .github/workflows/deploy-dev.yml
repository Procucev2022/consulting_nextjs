name: Deploy to Cloudflare (Development)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  deploy-dev:
    name: Deploy to Cloudflare Development Environment
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix frontend --legacy-peer-deps
          npm ci --prefix backend --legacy-peer-deps

      - name: Build Frontend (OpenNext / Vinext)
        run: npm run build:vinext || npm run cloudflare:build
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: "https://consulting-nextjs-backend.srinivas-mukku.workers.dev"
          BACKEND_INTERNAL_URL: "https://consulting-nextjs-backend.srinivas-mukku.workers.dev"

      - name: Deploy Frontend to Cloudflare (Dev Environment)
        run: npx wrangler deploy --env dev
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply Backend D1 Schema (Development)
        run: npm --prefix backend run db:push -- --remote --seed
        env:
          D1_ENV: dev
          D1_DATABASE_NAME: consulting-db
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Backend Worker to Cloudflare (Dev Environment)
        run: npx wrangler deploy --env dev
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
