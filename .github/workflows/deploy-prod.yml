name: Deploy to Cloudflare (Production)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-prod:
    name: Deploy to Cloudflare Production Environment
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15

    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix frontend --legacy-peer-deps
          npm ci --prefix backend --legacy-peer-deps

      - name: Verify production D1 account and binding before writes or deploys
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > "$RUNNER_TEMP/d1-databases.json"
          node scripts/verify-production-d1.js "$RUNNER_TEMP/d1-databases.json"

      - name: Build Frontend (OpenNext / Vinext)
        run: npm run cloudflare:build
        working-directory: frontend

      - name: Apply Backend D1 Schema (Production)
        run: npm --prefix backend run db:push -- --remote
        env:
          D1_ENV: prod
          D1_DATABASE_NAME: consulting-db
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Frontend to Cloudflare (Production Environment)
        run: npx wrangler deploy --env prod
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Backend Worker to Cloudflare (Production Environment)
        run: npx wrangler deploy --env prod
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
